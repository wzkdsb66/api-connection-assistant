<div id="aca-settings-root" data-extension-id="api-connection-assistant">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>API 连接助手</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="aca-description">
                管理自己的 API 配置（名称 + 地址 + 密钥）。切换时只修改 API 连接，不会改动补全预设。
                密钥保存在酒馆原生密钥库与本机扩展数据中，不会导出、不随角色卡走。本插件不会发送任何消耗额度的请求。
            </p>
            <label class="checkbox_label">
                <input id="aca-float-window-enabled" type="checkbox">
                <span>启用悬浮快切窗（闪电球与窗口均可拖动）</span>
            </label>
            <div id="aca-profile-list" class="aca-profile-list"></div>
            <div class="aca-settings-actions">
                <button type="button" id="aca-add-profile" class="menu_button">新增 API 配置</button>
            </div>
        </div>
    </div>
</div>
