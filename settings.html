<div id="aca-settings-root" data-extension-id="api-connection-assistant">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>API 连接助手</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="aca-description">
                读取酒馆自带的 Connection Profiles 连接档案，提供悬浮快切、API 面板入口和不切换连接的一键测试。密钥始终由酒馆原生密钥库管理，本插件不存储、不导出密钥。
            </p>
            <label class="checkbox_label">
                <input id="aca-float-window-enabled" type="checkbox">
                <span>启用悬浮快切窗</span>
            </label>
            <div id="aca-profile-list" class="aca-profile-list"></div>
        </div>
    </div>
</div>
