<div id="aca-settings-root" data-extension-id="api-connection-assistant">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b data-tr="settings.title">API 连接助手</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="aca-description" data-tr="settings.description">
                按「站点」管理 API 连接：名称 + 网址 + 密钥 + 模型列表整体保存，一键切换。切换只改 API 连接，不动补全预设。
            </p>
            <div class="aca-switches">
                <label class="checkbox_label">
                    <input id="aca-float-window-enabled" type="checkbox">
                    <span data-tr="settings.float">启用悬浮快切窗（可拖动，位置自动记忆）</span>
                </label>
                <label class="checkbox_label">
                    <input id="aca-auto-sync" type="checkbox">
                    <span data-tr="settings.autosync">使用站点后自动同步到快切窗</span>
                </label>
            </div>
            <div class="aca-language-row">
                <span data-tr="settings.language">界面语言</span>
                <select id="aca-language">
                    <option value="auto" data-tr="settings.language.auto">跟随酒馆</option>
                    <option value="zh-cn" data-tr="settings.language.zh">中文</option>
                    <option value="en" data-tr="settings.language.en">English</option>
                </select>
            </div>
            <div class="aca-stats-row">
                <span class="aca-stats-hint" data-tr="settings.statsHint">使用统计只记在本机，不影响排序</span>
                <button type="button" id="aca-stats-reset" class="aca-ghost-button" data-tr="settings.statsReset">重置使用统计</button>
            </div>
            <div id="aca-group-filter" class="aca-group-filter"></div>
            <div id="aca-site-list" class="aca-site-list"></div>
            <div class="aca-settings-actions">
                <button type="button" id="aca-add-site" class="aca-primary-button" data-tr="editor.new">新增站点</button>
            </div>

            <div id="aca-editor" class="aca-editor hidden">
                <div class="aca-editor-title" id="aca-editor-title">新增站点</div>
                <label class="aca-field">
                    <span data-tr="field.name">名称（如：OpenRouter）</span>
                    <input type="text" id="aca-editor-name" data-tr-placeholder="field.name">
                </label>
                <label class="aca-field">
                    <span data-tr="field.url">API URL（https://.../v1）</span>
                    <input type="text" id="aca-editor-url" data-tr-placeholder="field.url">
                </label>
                <label class="aca-field">
                    <span data-tr="field.key">API Key（可多个：换行 / 逗号分隔，首个为默认）</span>
                    <textarea id="aca-editor-key" rows="2" placeholder="sk-..."></textarea>
                </label>
                <label class="aca-field">
                    <span data-tr="field.models">模型 ID（可多个：换行 / 逗号分隔，首个为默认）</span>
                    <textarea id="aca-editor-models" rows="2" placeholder="model-id&#10;another-model-id"></textarea>
                </label>
                <div class="aca-editor-row">
                    <label class="aca-field aca-field-grow">
                        <span data-tr="field.group">分组</span>
                        <select id="aca-editor-group"></select>
                    </label>
                    <button type="button" id="aca-editor-new-group" class="aca-ghost-button" data-tr="group.new">＋ 新分组</button>
                    <button type="button" id="aca-editor-fetch-models" class="aca-ghost-button" data-tr="fetch.models">获取模型</button>
                </div>
                <div class="aca-editor-actions">
                    <button type="button" id="aca-editor-save" class="aca-primary-button" data-tr="editor.save">保存站点</button>
                    <button type="button" id="aca-editor-cancel" class="aca-ghost-button" data-tr="editor.cancel">取消</button>
                    <button type="button" id="aca-editor-delete" class="aca-ghost-button aca-danger" data-tr="action.delete">删除</button>
                </div>
                <div id="aca-editor-status" class="aca-editor-status"></div>
            </div>

            <div class="aca-io-row">
                <label class="checkbox_label aca-io-checkbox">
                    <input id="aca-export-keys" type="checkbox">
                    <span data-tr="io.includeKeys">导出时包含密钥</span>
                </label>
                <button type="button" id="aca-export" class="aca-ghost-button" data-tr="io.export">导出</button>
                <button type="button" id="aca-import" class="aca-ghost-button" data-tr="io.import">导入</button>
                <input type="file" id="aca-import-file" accept="application/json,.json" class="hidden">
            </div>
        </div>
    </div>
</div>
